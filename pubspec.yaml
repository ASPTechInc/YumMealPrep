name: yummealprep
description: >-
  A free and open-source, offline meal planner and digital recipe book.

# The app is distributed as source and through app stores, not pub.dev.
publish_to: "none"

# version: <build-name>+<build-number>. On Android the build name is the
# versionName and the build number is the versionCode; on iOS they are
# CFBundleShortVersionString and CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  image: ^4.12.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  table_calendar: ^3.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  integration_test:
    sdk: flutter

# To run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app/yummealprep-logo.png"
  android: true
  ios: true

# To run: dart run import_sorter:main
import_sorter:
  emojis: false
  comments: true
  ignored_files: []

flutter:
  uses-material-design: true

  assets:
    # Only the sample data. Other files in assets/data/ (such as a raw
    # Firestore export) are deliberately not bundled.
    - assets/data/seed.json
    - assets/fonts/
    - assets/images/CREDITS.md
    - assets/images/app/
    - assets/images/categories/
    - assets/images/meals/
    - assets/images/recipes/
    - CHANGELOG.md
    - LICENSE
    - PRIVACY_POLICY.md
