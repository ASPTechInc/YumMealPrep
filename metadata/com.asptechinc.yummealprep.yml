# F-Droid build recipe for YumMealPrep, kept here so it can be linted in CI
# (.github/workflows/foss_audit.yml) and copied into fdroiddata when the app
# is submitted. The store listing text and pictures come from
# fastlane/metadata/android/.
# Format: https://f-droid.org/docs/Build_Metadata_Reference/
Categories:
  - Recipe Manager
  - Diet
License: MIT
AuthorName: ASPTechnologies Incorporation
SourceCode: https://github.com/ASPTechInc/YumMealPrep
IssueTracker: https://github.com/ASPTechInc/YumMealPrep/issues
Changelog: https://github.com/ASPTechInc/YumMealPrep/blob/HEAD/CHANGELOG.md
Donate: https://buymeacoffee.com/asptechinc

AutoName: YumMealPrep

RepoType: git
Repo: https://github.com/ASPTechInc/YumMealPrep.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.8
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1
